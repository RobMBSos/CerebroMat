name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ── Prepare lowercase image prefix ──────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.lower.outputs.prefix }}
    steps:
      - id: lower
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cerebromat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d cerebromat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/cerebromat_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-12chars
      JWT_REFRESH_SECRET: test-refresh-secret-12chars
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @cerebromat/shared build

      - name: Generate Prisma client
        run: pnpm --filter @cerebromat/api db:generate

      - name: Run Prisma migrations
        run: pnpm --filter @cerebromat/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ── Job 2: Build Docker images (parallel matrix) ──────────────────────────
  build:
    name: Build ${{ matrix.app }}
    needs: [test, prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dockerfiles/${{ matrix.app }}.Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.app }}:${{ github.sha }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ── Job 3: Deploy to VPS ──────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR
          script: |
            set -e
            cd /opt/cerebromat

            # Load production environment
            set -a && source .env.production && set +a

            # Authenticate with GitHub Container Registry
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull latest images
            docker compose -f docker-compose.production.yml pull

            # Run database migrations (uses DATABASE_URL from compose env)
            docker compose -f docker-compose.production.yml run --rm api npx prisma migrate deploy

            # Rolling restart (each service waits for health check)
            docker compose -f docker-compose.production.yml up -d --no-deps --wait api
            docker compose -f docker-compose.production.yml up -d --no-deps --wait web
            docker compose -f docker-compose.production.yml up -d --no-deps --wait mobile
            docker compose -f docker-compose.production.yml up -d --no-deps --wait caddy

            # Prune old images
            docker image prune -f
